name: link checking

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: "00 18 * * *"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    permissions:
      issues: write # required for peter-evans/create-issue-from-file
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: .
          fail: false
      - name: Get previous issue number
        id: previous
        run: |
          number="$(gh issue list --label 'link-checking,automated-issue' --limit 1 --json number --jq '.[0].number')"
          echo "issue-number=$number" >> "$GITHUB_OUTPUT"
          echo "issue-number=$number"
      - name: Create Issue From File
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        id: issue
        with:
          title: Unresolved links
          content-filepath: ./lychee/out.md
          labels: link-checking, automated-issue
          issue-number: ${{ steps.previous.outputs.issue-number }}
      - name: Close issue when links are fixed
        if: steps.lychee.outputs.exit_code == 0 && steps.previous.outputs.issue-number != ''
        run: |
          gh issue close "${{ steps.previous.outputs.issue-number }}" \
            --comment "All links are working again, closing automatically."
          rm -f issue-number
